name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - run: cp .env.example .env

      - name: Start Postgres, MinIO, and the AI service
        run: docker compose up -d --build --wait postgres minio minio-init ml-service
        env:
          # heuristic here, not the pretrained default - CI verifies the pipeline works, not
          # prediction quality, and heuristic mode needs no ~600MB checkpoint download.
          ML_MODEL_MODE: heuristic

      - run: npm run migrate:up --workspace=apps/backend
      - run: npm run type-check --workspace=apps/backend
      - run: npm run lint --workspace=apps/backend
      - run: npm run build --workspace=apps/backend

      - name: Test
        run: npm test --workspace=apps/backend
        env:
          # No Fabric network in CI (see network/README.md - it's a separate, heavier setup).
          # mrv.test.ts asserts the honestly-disabled 503 path instead of a real tokenize.
          FABRIC_ENABLED: false

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run type-check --workspace=apps/web
      - run: npm run lint --workspace=apps/web
      - run: npm test --workspace=apps/web
      - run: npm run build --workspace=apps/web

  chaincode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=chaincode/mrv-contract
      - run: npm test --workspace=chaincode/mrv-contract

  ml-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: ml-service
        run: pip install -r requirements.txt
      - working-directory: ml-service
        # heuristic here: fast, no ~600MB checkpoint download. pretrained mode's own path is
        # covered by test_pretrained_classifier.py running locally / in the docker-build job's
        # image build (which bakes and therefore exercises loading the real checkpoint) rather
        # than a second full pytest run here.
        run: pytest tests/ -v
        env:
          ML_MODEL_MODE: heuristic

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: cp .env.example .env

      - name: Start the backend and everything it needs
        run: docker compose up -d --build --wait postgres minio minio-init ml-service migrate backend
        env:
          FABRIC_ENABLED: false
          ML_MODEL_MODE: heuristic

      - working-directory: apps/mobile
        run: flutter pub get
      - working-directory: apps/mobile
        run: flutter analyze
      - name: Test (including integration tests against the backend just started above)
        working-directory: apps/mobile
        run: flutter test

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env

      - name: Build and start the full app stack
        run: docker compose up -d --build --wait postgres minio minio-init ml-service migrate backend web
        env:
          ML_MODEL_MODE: heuristic

      - name: Smoke test
        run: |
          curl -sf http://localhost:4000/api/system/health | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = "200"

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs
